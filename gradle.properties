#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#KSP
# Enable KSP 2 which runs within Gradle daemon and handles concurrent access better
ksp.useKSP2=true

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true
accelbyteTypescriptSdkRepo=https://github.com/AccelByte/accelbyte-typescript-sdk.git
accelbyteTypescriptSdkBranch=main
accelbyteSdkBuildScript=workspaces foreach -Apt run build
forceAccelbyteSdkDownload=false

# Forward the dev-mode resume-game shutdown-delay override to all
# `:server:run` and `:server-extend:run` JVMs. Without this, the
# 15-second default kills the DS before the user can switch tabs and
# resume. start_servers.sh sets AUTOGENESIS_SHUTDOWN_DELAY_MS=600000
# by default; pass a smaller value (or unset) in production.
#
# The forwarding is done in server/build.gradle.kts and
# server-extend/build.gradle.kts via applicationDefaultJvmArgs, NOT
# here. Gradle does not auto-forward env vars to the application JVM,
# so a gradle.properties entry would be inert.
